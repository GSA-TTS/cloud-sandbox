apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: backstage-ecr-template
  title: Create ECR
  description: Provision and configure a new AWS ECR instance.
  tags:
    - 'single-resource'
    - 'product-containers'
    - 'product-serverless'
    - 'tier-developer'
spec:
  owner: example-org/platform-team
  type: AWS Service
  parameters:
    - title: Name
      required:
        - ecr_names
        - deployment_env
        - github_org
        - github_repo
      properties:
        ecr_names:
          title: ECR Names
          type: array
          items:
            type: string
          ui:field: DelimitedTextArray
          ui:options:
            name: ECR Names
            description: A comma-delimited list of names for the ECRs that should be created
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to iac)
          default: "iac"
    - title: Advanced Settings
      description: >-
        Override module versioning. Defaults are suitable for most deployments.
      properties:
        module_version:
          title: Module Version
          type: string
          description: Tag version of the ECR module in Example-IaC-Modules (e.g. v1.0.0, v2.0.0)
          default: "v1.0.0"
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_platform'
        headers:
          content-type: 'application/json'
        body:
            workflow_name: ${{ "NewIAC" }}
            workflow_id: ${{ "NewIAC-ecr-" + parameters.github_org + "-" + parameters.ecr_names[0] + "-" + parameters.deployment_env }}
            task_queue: ${{ platform.taskQueue }}
            workflow_args:
              branch_name: ${{ parameters.github_org + "/" + parameters.deployment_env + "/ecr/" + parameters.ecr_names[0] }}
              repo_owner: ${{ parameters.github_org }}
              repo_name: ${{ parameters.github_repo }}
              pr_title: '${{ "Add ECR Repositories (" + parameters.github_org + "/" + parameters.deployment_env + ")" }}'
              pr_body: '${{ "Provisions ECR repositories in the " + parameters.deployment_env + " environment for " + parameters.github_org + "." }}'
              module_source_base: ${{ "git@github.example.com:example-org/Example-IaC-Modules.git/" }}
              module_version: ${{ parameters.module_version }}
              env_config_path: ${{ "env/{environment}/env.hcl" }}
              resource_type: ${{ "ecr" }}
              resource_config:
                name: ${{ parameters.ecr_names }}
                environments: ${{ parameters.deployment_env }}
                config:
                  ecr_names: ${{ parameters.ecr_names }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.example.com/"+parameters.github_org+"/"+parameters.github_repo+"/pulls"}}
        icon: github
