apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: backstage-sqs-template
  title: Create SQS
  description: Provision and configure a new AWS SQS instance.
  tags:
    - 'single-resource'
    - 'product-serverless'
    - 'product-containers'
    - 'tier-developer'
spec:
  owner: fdp/fcs-next
  type: AWS Service
  parameters:
    - title: Name
      required:
        - queue_name
        - deployment_env
        - github_org
        - github_repo
      properties:
        queue_name:
          title: Name
          type: string
          description: Enter the human-readable name of the queue. This name should end in ".fifo"
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to iac)
          default: "iac"
    - title: Optional SQS Parameters
      properties:
        content_based_deduplication:
          title: Content Based Deduplication?
          type: boolean
          description: Flag for enabling content-based deduplication for FIFO queues.
          default: false
        deduplication_scope:
          title: Content Based Deduplication
          type: string
          description: Specifies whether message deduplication occurs at the message group or queue level. Valid values are messageGroup and queue
          default: "queue"
        delay_seconds:
          title: Message Delay Time
          type: number
          description: The time in seconds that the delivery of all messages in the queue will be delayed. An integer from 0 to 900 (15 minutes)
          default: 0
        fifo_queue:
          title: FIFO Queue?
          type: boolean
          description: Flag for enabling the FIFO queue.
          default: true
        fifo_throughput_limit:
          title: FIFO Throughput Limit
          type: string
          description: Specifies whether the FIFO queue throughput quota applies to the entire queue or per message group. Valid values are perQueue and perMessageGroupId
          default: "perQueue"
        max_message_size:
          title: Max Message Size
          type: number
          description: The limit of how many bytes a message can contain before Amazon SQS rejects it. An integer from 1024 bytes (1 KiB) up to 262144 bytes (256 KiB)
          default: 262144
        message_retention_seconds:
          title: Message Retention Seconds (ms)
          type: number
          description: The number of seconds Amazon SQS retains a message. Integer representing seconds, from 60 (1 minute) to 1209600 (14 days)
          default: 345600
        receive_wait_time_seconds:
          title: Receive Wait Time
          type: number
          description: The time for which a ReceiveMessage call will wait for a message to arrive (long polling) before returning. An integer from 0 to 20 (seconds)
          default: 0
        visibility_timeout_seconds:
          title: Visibility Timeout Seconds
          type: number
          description: The visibility timeout for the queue. An integer from 0 to 43200 (12 hours)
          default: 32
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_fcsnext'
        headers:
          content-type: 'application/json'
        body:
            workflow_name: ${{ "NewIAC" }}
            workflow_id: ${{ "NewIAC-sqs-" + parameters.github_org + "-" + parameters.queue_name + "-" + parameters.deployment_env }}
            task_queue: ${{ fcs.taskQueue }}
            workflow_args:
              branch_name: ${{ parameters.github_org + "/" + parameters.deployment_env + "/sqs/" + parameters.queue_name }}
              repo_owner: ${{ parameters.github_org }}
              repo_name: ${{ parameters.github_repo }}
              pr_title: '${{ "Add SQS Queue: " + parameters.queue_name + " (" + parameters.github_org + "/" + parameters.deployment_env + ")" }}'
              pr_body: '${{ "Provisions an SQS queue named " + parameters.queue_name + " in the " + parameters.deployment_env + " environment for " + parameters.github_org + "." }}'
              module_source_base: ${{ "git@github.helix.gsa.gov:fdp/FCS-IaC-Modules.git/" }}
              env_config_path: ${{ "env/{environment}/env.hcl" }}
              resource_type: ${{ "sqs" }}
              resource_config:
                name: ${{ parameters.queue_name }}
                environments: ${{ parameters.deployment_env }}
                config:
                  name: ${{ parameters.queue_name }}
                  content_based_deduplication: ${{ parameters.content_based_deduplication }}
                  deduplication_scope: ${{ parameters.deduplication_scope }}
                  delay_seconds: ${{ parameters.delay_seconds }}
                  fifo_queue: ${{ parameters.fifo_queue }}
                  fifo_throughput_limit: ${{ parameters.fifo_throughput_limit }}
                  max_message_size: ${{ parameters.max_message_size }}
                  message_retention_seconds: ${{ parameters.message_retention_seconds }}
                  receive_wait_time_seconds: ${{ parameters.receive_wait_time_seconds }}
                  visibility_timeout_seconds: ${{ parameters.visibility_timeout_seconds }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.helix.gsa.gov/"+parameters.github_org+"/"+parameters.github_repo+"/pulls"}}
        icon: github
