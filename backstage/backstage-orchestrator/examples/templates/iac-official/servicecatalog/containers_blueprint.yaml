apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: containers_blueprint
  title: Containers Blueprint
  description: Containers Blueprint provisioning form.
  tags:
    - 'intake-and-provisioning'
    - 'product-containers-dev'
    - 'tier-techlead'
spec:
  owner: fdp/backstage-ops
  type: Intake and Provisioning
  parameters:
    - title: Name
      required:
        - deployment_env
      properties:
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - stage
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'stage'
            - 'prod'
        # github_org:
        #   title: GitHub Organization
        #   type: string
        #   description: Enter the target organization's GitHub name (defaulted to MCaaS)
        #   default: "MCaaS"
        # github_repo:
        #   title: GitHub Repository Name
        #   type: string
        #   description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to auto-tenant)
        #   default: "auto-tenant"
        tenant_id:
          title: Tenant ID
          type: string
          description: Enter the tenant ID
        account_path:
          title: Account Path
          type: string
          description: Enter the physical AWS Account ID
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_fcsnext'
        headers:
          content-type: 'application/json'
        body:
            workflow_name: ${{ "SubmitTenantCSVWorkflow" }}
            workflow_id: ${{ "SubmitTenantCSVWorkflow-" + parameters.tenant_id + "-" + parameters.deployment_env }}
            task_queue: ${{ fcs.taskQueue }}
            workflow_args:
              branch_name: ${{ "MCaaS/" + parameters.deployment_env + "/containers/" + parameters.tenant_id }}
              repo_owner: ${{ "MCaaS" }}
              repo_name: ${{ "auto-tenant" }}
              pr_title: '${{ "Add MCaaS Tenant: " + parameters.tenant_id + " (" + parameters.deployment_env + ")" }}'
              pr_body: '${{ "Provisions containers tenant " + parameters.tenant_id + " in the " + parameters.deployment_env + " environment." }}'
              environments: ${{ parameters.deployment_env }}
              tenant_id: ${{ parameters.tenant_id }}
              account_path: ${{ parameters.account_path }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.helix.gsa.gov/MCaaS/auto-tenant/pulls"}}
        icon: github
