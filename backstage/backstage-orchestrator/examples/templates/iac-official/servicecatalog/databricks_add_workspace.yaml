apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: databricks_add_workspace
  title: Databricks Lab/Sandbox Workspace
  description: New databricks blueprint provisioning form for lab/sandbox environments only.
  tags:
    - 'intake-and-provisioning'
    - 'product-databricks-dev'
    - 'tier-techlead'
spec:
  owner: example-org/backstage-ops
  type: Intake and Provisioning
  parameters:
    - title: Important Disclaimers
      description: Please read and acknowledge the following before proceeding
      properties:
        disclaimer_acknowledgement:
          title: Environment Information
          type: string
          ui:widget: textarea
          ui:options:
            rows: 8
          default: |
            ⚠️ IMPORTANT - READ BEFORE PROCEEDING ⚠️

            This Databricks workspace provisioning is intended for LAB/SANDBOX environments ONLY.

            • DATA GOVERNANCE: Standard data governance policies apply within the workspace."
            • FUNDING: The cost for Workspace usage will be drawn from pre-allocated EDS (Enterprise Data Services) funds, and your acknowledgement attests that you have approval from OCDO to use those funds.
            • COMPLIANCE: Lab/sandbox workspaces are NOT suitable for: production workloads, live or copied production data, otherwise sensitive data, or integration/exchanges with external data sources.
            • TEMPORARY USE: These lab workspaces are designed for short-term experimentation and learning purposes only. They are subject to be shutdown after 14 days, and any data or code resident within will be deleted.

            If you need a fully-governed Databricks Workspace that is suitable for long-term development and/or production use, please engage with the [Example Platform Cloud Advisory for Intake](https://backstage.example.gov/create/templates/default/intakeform).
          ui:disabled: true
        user_acknowledgement:
          title: I acknowledge this is for lab/sandbox use only
          type: boolean
          enum: [true]
          description: Check this box to confirm you understand this workspace is for lab/sandbox environments with minimal data governance
      required:
        - user_acknowledgement
    - title: Workspace Configuration
      required:
        - workspace_name
        - workspace_name_display
        - tenant_id
      properties:
        # deployment_env:
        #   title: Environment
        #   type: string
        #   description: The environment the service will be deployed in
        #   default: ops
        #   enum:
        #     - ops
        #     - nonprod
        #     - prod
        #   enumNames:
        #     - 'ops'
        #     - 'nonprod'
        #     - 'prod'
        # github_org:
        #   title: GitHub Organization
        #   type: string
        #   description: The organization in GitHub that should own the deployment
        #   ui:field: GitOrgPicker
        # github_repo:
        #   title: GitHub Repository Name
        #   type: string
        #   description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to iac)
        #   default: "account-management"
        # branch_name:
        #   title: Branch Name
        #   type: string
        #   description: Enter branch name
        # pr_title:
        #   title: PR Title
        #   type: string
        #   description: Enter the name of the PR to be created
        # pr_body:
        #   title: PR description
        #   type: string
        #   description: Enter a description of the PR to be create
        workspace_name:
          title: Workspace Name
          type: string
          description: Enter the workspace name to be created (lab/sandbox environment)
        workspace_name_display:
          title: Workspace Name Display
          type: string
          description: Enter the display name for the workspace (will be shown in Databricks UI)
        tenant_id:
          title: Tenant ID
          type: string
          description: Enter the tenant ID for this lab/sandbox workspace
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_platform'
        headers:
          content-type: 'application/json'
        body:
          workflow_name: ${{ "NewDataWorkspace" }}
          workflow_id: NewDataWorkspace-${{ parameters.workspace_name }}
          task_queue: ${{ "platform-development" }}
          workflow_args:
            repo_owner: ${{ "example-org" }}
            repo_name: ${{ "account-management" }}
            workspace_name: ${{ parameters.workspace_name }}
            workspace_name_display: ${{ parameters.workspace_name_display }}
            tenant_id: ${{ parameters.tenant_id }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.example.com/example-org/account-management/pulls"}}
        icon: github
