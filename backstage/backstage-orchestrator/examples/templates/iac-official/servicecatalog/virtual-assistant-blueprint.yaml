apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: virtual_assistant_blueprint
  title: Virtual Assistant Blueprint
  description: Provision an AI-powered Virtual Assistant backend with AWS Bedrock, RDS PostgreSQL, DynamoDB, OpenSearch, and Lambda.
  tags:
    - 'virtual-assistant'
    - 'blueprint'
    - 'product-virtual-desktop'
    - 'tier-techlead'
spec:
  owner: example-org/backstage-ops
  type: Intake and Provisioning
  parameters:
    # Page 1: Required Fields
    - title: Required Configuration
      required:
        - agent_name
        - deployment_env
        - github_org
        - github_repo
        - module_version
      properties:
        agent_name:
          title: Agent Name
          type: string
          description: Name of the virtual assistant agent (lowercase, alphanumeric, hyphens only)
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration
          default: "iac"
        module_version:
          title: Module Version
          type: string
          description: Git tag of the virtual-assistant-backend module to deploy
          default: "v1.1.25"

    # Page 2: S3 Bucket Names and Optional Services
    - title: S3 Buckets and Optional Services
      properties:
        s3_shared_bucket_suffix:
          title: S3 Shared Bucket Name
          type: string
          description: Name for the shared S3 bucket (Lambda layers and Bedrock). Must be globally unique.
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-shared"
            editable: true
            checkS3Availability: true
        s3_data_bucket_suffix:
          title: S3 Data Bucket Name
          type: string
          description: Name for the data S3 bucket (knowledge base documents). Must be globally unique.
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-data"
            editable: true
            checkS3Availability: true
        selected_sections:
          title: Optional Configuration Sections
          type: array
          description: Select which services to configure. Each selected service gets its own wizard page.
          items:
            type: string
          ui:field: SectionSelectorField
          ui:options:
            sections:
              - key: ecr
                label: ECR Repository
                description: Container image registry - image names, lifecycle rules, scanning
              - key: s3_advanced
                label: S3 Advanced Settings
                description: Bucket policies, versioning, encryption, and prefix configuration
              - key: lambda
                label: Lambda Functions
                description: Function names, IAM roles, timeouts, handlers, and runtimes
              - key: rds
                label: RDS PostgreSQL
                description: Database instance class, storage, credentials, and IAM auth
              - key: bedrock_kb
                label: Bedrock Knowledge Base
                description: KB name, models, chunking strategies, and data source settings
              - key: bedrock_guardrails
                label: Bedrock Guardrails
                description: Content filtering strengths and blocked messaging
              - key: opensearch
                label: OpenSearch Serverless
                description: Collection type, network and data access policies
              - key: api_gateway
                label: API Gateway
                description: REST API name, WAF, routing, and stage configuration
              - key: waf_cors
                label: WAF and CORS
                description: WAF default action, sampled requests, and CORS headers
              - key: dynamodb
                label: DynamoDB
                description: Table name, streams, TTL, billing mode, and encryption
              - key: github_deploy
                label: GitHub Deploy
                description: GitHub Actions IAM role and policy for automated deployments
              - key: ssm
                label: SSM Parameters
                description: Parameter path prefix and environment variable descriptions
              - key: file_paths
                label: Terraform File Paths
                description: Archive types, temp directories, and Lambda source filenames
              - key: kms
                label: KMS Keys
                description: Key rotation, deletion windows, alias names, and policy SIDs

    # Page 3: ECR Repository
    - title: ECR Configuration
      properties:
        _gate_ecr:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: ecr
        ecr_repository_name:
          title: ECR Repository Name
          type: string
          description: Name for ECR repository
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            editable: false
        ecr_backend_tag_name:
          title: ECR Backend Tag Name
          type: string
          description: Tag name for backend ECR repository
          default: "va-backend-ecr"
        ecr_lifecycle_rule_priority:
          title: ECR Lifecycle Rule Priority
          type: number
          description: Priority for ECR lifecycle policy rule
          default: 1
        ecr_image_count_limit:
          title: ECR Image Count Limit
          type: number
          description: Maximum number of ECR images to retain
          default: 1000
        ecr_image_tag_mutability:
          title: ECR Image Tag Mutability
          type: string
          description: ECR image tag mutability setting
          default: "MUTABLE"
        ecr_scan_on_push:
          title: ECR Scan On Push
          type: boolean
          description: Enable image scanning on push to ECR
          default: true
        ecr_encryption_type:
          title: ECR Encryption Type
          type: string
          description: Encryption type for ECR repository
          default: "AES256"
        ecr_force_delete:
          title: ECR Force Delete
          type: boolean
          description: Allow ECR repository deletion even if it contains images
          default: true
        ecr_lifecycle_tag_status:
          title: ECR Lifecycle Tag Status
          type: string
          description: Tag status for ECR lifecycle policy
          default: "any"
        ecr_lifecycle_count_type:
          title: ECR Lifecycle Count Type
          type: string
          description: Count type for ECR lifecycle policy
          default: "imageCountMoreThan"
        ecr_lifecycle_action_type:
          title: ECR Lifecycle Action Type
          type: string
          description: Action type for ECR lifecycle policy
          default: "expire"
        ecr_check_interpreter:
          title: ECR Check Interpreter
          type: array
          description: Interpreter for ECR image check command
          items:
            type: string
          default: ["sh", "-c"]

    # Page 4: S3 Advanced Settings
    - title: S3 Advanced Configuration
      properties:
        _gate_s3_advanced:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: s3_advanced
        s3_force_destroy:
          title: S3 Force Destroy
          type: boolean
          description: Allow destruction of S3 buckets even if they contain objects
          default: true
        s3_block_public_acls:
          title: S3 Block Public ACLs
          type: boolean
          description: Block public ACLs on S3 buckets
          default: true
        s3_block_public_policy:
          title: S3 Block Public Policy
          type: boolean
          description: Block public bucket policies on S3 buckets
          default: true
        s3_ignore_public_acls:
          title: S3 Ignore Public ACLs
          type: boolean
          description: Ignore public ACLs on S3 buckets
          default: true
        s3_restrict_public_buckets:
          title: S3 Restrict Public Buckets
          type: boolean
          description: Restrict public bucket policies on S3 buckets
          default: true
        s3_versioning_status:
          title: S3 Versioning Status
          type: string
          description: S3 bucket versioning status
          default: "Enabled"
        s3_object_ownership:
          title: S3 Object Ownership
          type: string
          description: Object ownership setting for S3 buckets
          default: "BucketOwnerEnforced"
        s3_kb_prefix:
          title: S3 Knowledge Base Prefix
          type: string
          description: S3 prefix for knowledge base documents
          default: "knowledgebase"
        s3_bedrock_prefix:
          title: S3 Bedrock Prefix
          type: string
          description: S3 prefix for Bedrock transformation data
          default: "aws/bedrock"
        s3_init_data_key:
          title: S3 Init Data Key
          type: string
          description: S3 key for init data index mapping file
          default: "init-data/kb-index-mapping.json"
        s3_init_data_content_type:
          title: S3 Init Data Content Type
          type: string
          description: Content type for init data files
          default: "application/json"
        s3_sse_algorithm:
          title: S3 SSE Algorithm
          type: string
          description: Server-side encryption algorithm for S3 buckets
          default: "AES256"
        s3_kms_sse_algorithm:
          title: S3 KMS SSE Algorithm
          type: string
          description: KMS encryption algorithm for S3 buckets
          default: "aws:kms"

    # Page 5: Lambda Functions
    - title: Lambda Configuration
      properties:
        _gate_lambda:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: lambda
        lambda_backend_function_name:
          title: Lambda Backend Function Name
          type: string
          description: Name for backend Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-backend-lambda"
            editable: false
        lambda_db_migrate_function_name:
          title: Lambda DB Migrate Function Name
          type: string
          description: Name for database migration Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-db-migrate-lambda"
            editable: false
        lambda_dynamo_streams_function_name:
          title: Lambda DynamoDB Streams Function Name
          type: string
          description: Name for DynamoDB streams Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-dynamo-streams-lambda"
            editable: false
        lambda_init_data_function_name:
          title: Lambda Init Data Function Name
          type: string
          description: Name for init data Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-init-data-lambda"
            editable: false
        lambda_metadata_function_name:
          title: Lambda Metadata Function Name
          type: string
          description: Name for metadata Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-metadata-lambda"
            editable: false
        lambda_init_layer_name:
          title: Lambda Init Layer Name
          type: string
          description: Name for init data Lambda layer
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-init-data-layer"
            editable: false
        iam_backend_role_name:
          title: IAM Backend Role Name
          type: string
          description: Name for backend Lambda IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-backend-role-bedrock"
            editable: false
        iam_db_migrate_role_name:
          title: IAM DB Migrate Role Name
          type: string
          description: Name for database migration Lambda IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-db-migrate-role-bedrock"
            editable: false
        iam_dynamo_streams_role_name:
          title: IAM DynamoDB Streams Role Name
          type: string
          description: Name for DynamoDB streams Lambda IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-dynamo-streams-role-bedrock"
            editable: false
        iam_init_data_role_name:
          title: IAM Init Data Role Name
          type: string
          description: Name for init data Lambda IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-init-data-lambda-role-iam"
            editable: false
        iam_metadata_role_name:
          title: IAM Metadata Role Name
          type: string
          description: Name for metadata Lambda IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-metadata-lambda-role-iam"
            editable: false
        lambda_timeout_seconds:
          title: Lambda Timeout Seconds
          type: number
          description: Lambda function timeout in seconds
          default: 900
        lambda_log_retention_days:
          title: Lambda Log Retention Days
          type: number
          description: CloudWatch log retention for Lambda functions in days
          default: 5
        lambda_log_format:
          title: Lambda Log Format
          type: string
          description: Lambda log format (Text or JSON)
          default: "Text"
        lambda_runtime:
          title: Lambda Runtime
          type: string
          description: Python runtime version for Lambda functions
          default: "python3.12"
        lambda_timezone:
          title: Lambda Timezone
          type: string
          description: Timezone for Lambda functions
          default: "America/New_York"
        lambda_basic_execution_policy_arn:
          title: Lambda Basic Execution Policy ARN
          type: string
          description: ARN for AWS Lambda basic execution policy
          default: "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        lambda_vpc_execution_policy_arn:
          title: Lambda VPC Execution Policy ARN
          type: string
          description: ARN for AWS Lambda VPC access execution policy
          default: "arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        lambda_dynamodb_execution_policy_arn:
          title: Lambda DynamoDB Execution Policy ARN
          type: string
          description: ARN for AWS Lambda DynamoDB execution policy
          default: "arn:aws:iam::aws:policy/service-role/AWSLambdaDynamoDBExecutionRole"
        lambda_backend_policy_name:
          title: Lambda Backend Policy Name
          type: string
          description: Name for backend Lambda IAM policy
          default: "backend_policy"
        lambda_backend_sid_ssm:
          title: Lambda Backend SID SSM
          type: string
          description: Statement ID for backend Lambda SSM access
          default: "ReadAccessToSsm"
        lambda_backend_sid_secrets:
          title: Lambda Backend SID Secrets
          type: string
          description: Statement ID for backend Lambda Secrets Manager access
          default: "ReadAccessToSecrets"
        lambda_backend_sid_s3:
          title: Lambda Backend SID S3
          type: string
          description: Statement ID for backend Lambda S3 access
          default: "AccessToDataBucket"
        lambda_backend_sid_dynamodb:
          title: Lambda Backend SID DynamoDB
          type: string
          description: Statement ID for backend Lambda DynamoDB access
          default: "AccessToDynamoDb"
        lambda_backend_sid_guardrails:
          title: Lambda Backend SID Guardrails
          type: string
          description: Statement ID for backend Lambda guardrails access
          default: "AccessToGuardrails"
        lambda_backend_sid_kb:
          title: Lambda Backend SID Knowledge Base
          type: string
          description: Statement ID for backend Lambda knowledge base access
          default: "AccessToKnowledgebase"
        lambda_backend_sid_kms:
          title: Lambda Backend SID KMS
          type: string
          description: Statement ID for backend Lambda KMS access
          default: "AccessToKms"
        lambda_backend_handler_command:
          title: Lambda Backend Handler Command
          type: array
          description: Handler command for backend Lambda container
          items:
            type: string
          default: ["backend_lambda.handle_event"]
        lambda_backend_cors_origins:
          title: Lambda Backend CORS Origins
          type: string
          description: CORS allowed origins for backend Lambda
          default: "*"
        lambda_streams_policy_name:
          title: Lambda Streams Policy Name
          type: string
          description: Name for DynamoDB streams Lambda IAM policy
          default: "dynamo_streams_policy"
        lambda_streams_handler_command:
          title: Lambda Streams Handler Command
          type: array
          description: Handler command for streams Lambda container
          items:
            type: string
          default: ["sqs_chat_lambda.handle_event"]
        lambda_streams_starting_position:
          title: Lambda Streams Starting Position
          type: string
          description: Starting position for DynamoDB stream event source
          default: "LATEST"
        lambda_streams_batch_size:
          title: Lambda Streams Batch Size
          type: number
          description: Batch size for DynamoDB stream processing
          default: 5
        lambda_streams_batching_window_seconds:
          title: Lambda Streams Batching Window Seconds
          type: number
          description: Maximum batching window in seconds for DynamoDB streams
          default: 5
        lambda_streams_max_retry_attempts:
          title: Lambda Streams Max Retry Attempts
          type: number
          description: Maximum retry attempts for DynamoDB stream processing
          default: 3
        lambda_streams_enabled:
          title: Lambda Streams Enabled
          type: boolean
          description: Enable DynamoDB stream event source mapping
          default: true
        lambda_streams_function_response_types:
          title: Lambda Streams Function Response Types
          type: array
          description: Function response types for DynamoDB stream processing
          items:
            type: string
          default: ["ReportBatchItemFailures"]
        lambda_migrate_policy_name:
          title: Lambda Migrate Policy Name
          type: string
          description: Name for DB migration Lambda IAM policy
          default: "db_migrate_policy"
        lambda_migrate_handler_command:
          title: Lambda Migrate Handler Command
          type: array
          description: Handler command for DB migration Lambda container
          items:
            type: string
          default: ["db_migrate_lambda.handle_event"]
        lambda_metadata_policy_name:
          title: Lambda Metadata Policy Name
          type: string
          description: Name for metadata Lambda IAM policy
          default: "metadata_lambda_policy"
        lambda_metadata_filename:
          title: Lambda Metadata Filename
          type: string
          description: Python filename for metadata Lambda function
          default: "metadata_lambda.py"
        lambda_metadata_handler:
          title: Lambda Metadata Handler
          type: string
          description: Handler for metadata Lambda function
          default: "metadata_lambda.handle_event"
        lambda_package_type_image:
          title: Lambda Package Type Image
          type: string
          description: Package type for Lambda functions using Docker images
          default: "Image"
        lambda_package_type_zip:
          title: Lambda Package Type Zip
          type: string
          description: Package type for Lambda functions using ZIP files
          default: "Zip"
        lambda_replace_security_groups_on_destroy:
          title: Lambda Replace Security Groups On Destroy
          type: boolean
          description: Replace security groups on Lambda destruction
          default: true
        lambda_init_policy_name:
          title: Lambda Init Policy Name
          type: string
          description: Name for init data Lambda IAM policy
          default: "init_data_lambda_policy"
        lambda_init_handler:
          title: Lambda Init Handler
          type: string
          description: Handler for init data Lambda function
          default: "init_data_lambda.handle_event"
        lambda_init_file_permission:
          title: Lambda Init File Permission
          type: string
          description: File permission for init Lambda layer script
          default: "0755"
        lambda_layer_compatible_runtimes:
          title: Lambda Layer Compatible Runtimes
          type: array
          description: Compatible runtimes for Lambda layer
          items:
            type: string
          default: ["python3.12"]
        lambda_layer_interpreter:
          title: Lambda Layer Interpreter
          type: array
          description: Interpreter for null resource commands
          items:
            type: string
          default: ["sh", "-c"]

    # Page 6: RDS PostgreSQL Database
    - title: RDS Configuration
      properties:
        _gate_rds:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: rds
        rds_database_name:
          title: Database Name
          type: string
          description: Name for the PostgreSQL database
          default: "virtual_assistant_db"
        rds_subnet_group_name:
          title: RDS Subnet Group Name
          type: string
          description: Name for RDS subnet group
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-rds-subnet-group"
            editable: false
        rds_instance_identifier:
          title: RDS Instance Identifier
          type: string
          description: Identifier for RDS PostgreSQL instance
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-rds-pg-instance"
            editable: false
        rds_import_role_name:
          title: RDS Import Role Name
          type: string
          description: Name for RDS S3 import IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-import-rds-iam-role"
            editable: false
        rds_export_role_name:
          title: RDS Export Role Name
          type: string
          description: Name for RDS S3 export IAM role
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-export-rds-iam-role"
            editable: false
        rds_allocated_storage:
          title: RDS Allocated Storage
          type: number
          description: Allocated storage for RDS instance in GB
          default: 30
        rds_engine:
          title: RDS Engine
          type: string
          description: Database engine type
          default: "postgres"
        rds_engine_version:
          title: RDS Engine Version
          type: string
          description: Database engine version
          default: "18.3"
        rds_instance_class:
          title: RDS Instance Class
          type: string
          description: RDS instance class
          default: "db.t3.small"
        rds_username:
          title: RDS Username
          type: string
          description: Master username for RDS instance
          default: "postgres"
        rds_manage_master_user_password:
          title: RDS Manage Master User Password
          type: boolean
          description: Let AWS manage the master user password
          default: true
        rds_storage_encrypted:
          title: RDS Storage Encrypted
          type: boolean
          description: Enable storage encryption for RDS
          default: true
        rds_skip_final_snapshot:
          title: RDS Skip Final Snapshot
          type: boolean
          description: Skip final snapshot when destroying RDS instance
          default: true
        rds_final_snapshot_identifier:
          title: RDS Final Snapshot Identifier
          type: string
          description: Name of final snapshot if skip_final_snapshot is false
          default: "final-snapshot"
        rds_iam_database_authentication_enabled:
          title: RDS IAM Database Authentication
          type: boolean
          description: Enable IAM database authentication
          default: true
        rds_apply_immediately:
          title: RDS Apply Immediately
          type: boolean
          description: Apply changes immediately instead of during maintenance window
          default: false
        rds_subnet_group_description:
          title: RDS Subnet Group Description
          type: string
          description: Description for RDS subnet group
          default: "RDS subnet group"
        rds_import_policy_name:
          title: RDS Import Policy Name
          type: string
          description: Name for RDS S3 import IAM policy
          default: "import_policy"
        rds_export_policy_name:
          title: RDS Export Policy Name
          type: string
          description: Name for RDS S3 export IAM policy
          default: "export_policy"
        rds_s3_import_feature_name:
          title: RDS S3 Import Feature Name
          type: string
          description: Feature name for RDS S3 import
          default: "s3Import"
        rds_s3_export_feature_name:
          title: RDS S3 Export Feature Name
          type: string
          description: Feature name for RDS S3 export
          default: "s3Export"
        rds_password_length:
          title: RDS Password Length
          type: number
          description: Length of generated RDS password
          default: 24
        rds_password_special:
          title: RDS Password Special Characters
          type: boolean
          description: Include special characters in RDS password
          default: true
        rds_password_min_upper:
          title: RDS Password Min Uppercase
          type: number
          description: Minimum uppercase characters in RDS password
          default: 2
        rds_password_min_numeric:
          title: RDS Password Min Numeric
          type: number
          description: Minimum numeric characters in RDS password
          default: 2
        rds_password_min_lower:
          title: RDS Password Min Lowercase
          type: number
          description: Minimum lowercase characters in RDS password
          default: 2
        rds_password_min_special:
          title: RDS Password Min Special
          type: number
          description: Minimum special characters in RDS password
          default: 2
        rds_password_override_special:
          title: RDS Password Override Special
          type: string
          description: Override special characters allowed in RDS password
          default: "#%-_{}[]<>:"

    # Page 7: Bedrock Knowledge Base
    - title: Bedrock Knowledge Base Configuration
      properties:
        _gate_bedrock_kb:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: bedrock_kb
        bedrock_kb_name:
          title: Bedrock Knowledge Base Name
          type: string
          description: Name for Bedrock Knowledge Base
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-kb"
            editable: false
        bedrock_kb_help_docs_datasource_name:
          title: Bedrock KB Help Docs DataSource Name
          type: string
          description: Name for Bedrock KB help docs data source
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-s3-help-docs"
            editable: false
        bedrock_kb_workbooks_datasource_name:
          title: Bedrock KB Workbooks DataSource Name
          type: string
          description: Name for Bedrock KB workbooks data source
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-s3-workbooks"
            editable: false
        bedrock_nova_lite_profile_name:
          title: Bedrock Nova Lite Profile Name
          type: string
          description: Name for Bedrock Nova Lite inference profile
          ui:field: DerivedField
          ui:options:
            sourceField: agent_name
            suffix: "-nova-lite-profile"
            editable: false
        bedrock_nova_pro_profile_name:
          title: Bedrock Nova Pro Profile Name
          type: string
          description: Name for Bedrock Nova Pro inference profile
