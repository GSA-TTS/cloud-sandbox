    # Page 15: KMS Keys
    - title: KMS Configuration
      properties:
        _gate_kms:
          title: Section Gate
          type: string
          description: Internal field - controls visibility of this section
          ui:field: SectionGateField
          ui:options:
            sectionKey: kms
        kms_deletion_window_days:
          title: KMS Deletion Window Days
          type: number
          description: Number of days before KMS key deletion
          default: 7
        kms_enable_key_rotation:
          title: KMS Enable Key Rotation
          type: boolean
          description: Enable automatic KMS key rotation
          default: true
        kms_policy_id:
          title: KMS Policy ID
          type: string
          description: ID for KMS key policy
          default: "KmsPolicy"
        kms_policy_version:
          title: KMS Policy Version
          type: string
          description: Version for KMS key policy
          default: "2012-10-17"
        kms_s3_description:
          title: KMS S3 Description
          type: string
          description: Description for S3 KMS key
          default: "KMS key for S3 bucket encryption"
        kms_s3_sid_root:
          title: KMS S3 SID Root
          type: string
          description: Statement ID for S3 KMS root access
          default: "DoNOTDelete"
        kms_s3_sid_resources:
          title: KMS S3 SID Resources
          type: string
          description: Statement ID for S3 KMS resource access
          default: "AwsResourcesAccess"
        kms_s3_sid_cloudfront:
          title: KMS S3 SID CloudFront
          type: string
          description: Statement ID for CloudFront KMS access to S3
          default: "CloudfrontAccess"
        kms_sqs_description:
          title: KMS SQS Description
          type: string
          description: Description for SQS KMS key
          default: "KMS key for SQS encryption"
        kms_sqs_sid_root:
          title: KMS SQS SID Root
          type: string
          description: Statement ID for SQS KMS root access
          default: "DontDelete"
        kms_sqs_sid_backend:
          title: KMS SQS SID Backend
          type: string
          description: Statement ID for backend Lambda SQS KMS access
          default: "BackendAccess"
        kms_dynamodb_description:
          title: KMS DynamoDB Description
          type: string
          description: Description for DynamoDB KMS key
          default: "KMS key for DynamoDB table encryption"
        kms_dynamodb_sid_root:
          title: KMS DynamoDB SID Root
          type: string
          description: Statement ID for DynamoDB KMS root access
