apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: serverless_stack_blueprint
  title: Serverless Stack Blueprint
  description: Provision a complete serverless stack with Lambda, SQS, API Gateway, and DynamoDB.
  tags:
    - 'product-serverless'
    - 'blueprint'
    - 'tier-techlead'
spec:
  owner: example-org/platform-team
  type: Intake and Provisioning
  parameters:
    # Page 1: Core Config
    - title: Required Configuration
      required:
        - stack_name
        - deployment_env
        - github_org
        - github_repo
        - stack_version
      properties:
        stack_name:
          title: Stack Name
          type: string
          description: Name for this serverless stack (lowercase, alphanumeric, hyphens only)
        deployment_env:
          title: Environment
          type: string
          description: The environment the stack will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration
          default: "iac"
        stack_version:
          title: Stack Version
          type: string
          description: Version of the serverless stack to deploy
          default: "v1.0.0"
          enum:
            - v1.0.0

    # Page 2: Resource Names + Optional Skip Gate
    - title: Resource Names and Optional Configuration
      required:
        - function_name
        - package_type
        - queue_name
        - api_name
        - table_name
      properties:
        function_name:
          title: Lambda Function Name
          type: string
          description: Name for the Lambda function
          ui:field: DerivedField
          ui:options:
            sourceField: stack_name
            suffix: "-lambda"
            editable: true
        package_type:
          title: Lambda Package Type
          type: string
          description: >-
            The Lambda deployment package type. Choose Image to run the function
            from a container image you built and pushed to ECR. Choose Zip to
            deploy from a source package (uses the built-in bootstrap handler
            when no package is supplied).
          default: "Zip"
          enum:
            - Image
            - Zip
          enumNames:
            - 'Image (container from ECR)'
            - 'Zip (source package)'
        queue_name:
          title: SQS Queue Name
          type: string
          description: Name for the SQS queue (must end in .fifo for FIFO queues)
          ui:field: DerivedField
          ui:options:
            sourceField: stack_name
            suffix: "-sqs.fifo"
            editable: true
        api_name:
          title: API Gateway Name
          type: string
          description: Name for the API Gateway
          ui:field: DerivedField
          ui:options:
            sourceField: stack_name
            suffix: "-api"
            editable: true
        table_name:
          title: DynamoDB Table Name
          type: string
          description: Name for the DynamoDB table
          ui:field: DerivedField
          ui:options:
            sourceField: stack_name
            suffix: "-db"
            editable: true
        hash_key:
          title: DynamoDB Hash Key
          type: string
          description: DynamoDB table partition key
          default: "id"
        billing_mode:
          title: DynamoDB Billing Mode
          type: string
          description: DynamoDB billing mode
          default: "PROVISIONED"
          enum:
            - PROVISIONED
            - PAY_PER_REQUEST
          enumNames:
            - 'PROVISIONED'
            - 'PAY_PER_REQUEST (On-demand)'
        selected_sections:
          title: Optional Configuration Sections
          type: array
          description: Select which modules to configure advanced settings for. All modules will be provisioned regardless.
          items:
            type: string
          ui:field: SectionSelectorField
          ui:options:
            sections:
              - key: lambda_advanced
                label: Lambda Advanced Settings
                description: Timeout, VPC, environment variables
              - key: sqs_advanced
                label: SQS Advanced Settings
                description: FIFO, retention, visibility timeout, deduplication
              - key: apigateway_advanced
                label: API Gateway Advanced Settings
                description: HTTP method, authorization, resource path, description
              - key: dynamodb_advanced
                label: DynamoDB Advanced Settings
                description: Streams, encryption, autoscaling, point-in-time recovery
              - key: iam_advanced
                label: IAM Role Advanced Settings
                description: Create a new role or attach an existing one
              - key: connections
                label: Resource Connections
                description: Wire API Gateway, Lambda, SQS, DynamoDB, and IAM together
      if:
        properties:
          package_type:
            const: Image
      then:
        required:
          - image_uri
        properties:
          image_uri:
            title: Lambda Image URI
            type: string
            description: >-
              Required for Image packages. The full ECR image URI to deploy,
              including tag (e.g.
              <account-id>.dkr.ecr.<region>.amazonaws.com/<repository>:<tag>).
              The handler and runtime are baked into the image, so they are not
              set here.
      else:
        properties:
          handler:
            title: Lambda Handler
            type: string
            description: Lambda Function entrypoint in your code
            default: "app.lambda_handler"
          runtime:
            title: Lambda Runtime
            type: string
            description: Lambda Function runtime
            default: "python3.12"

    # Page 3: Lambda Advanced (optional)
    - title: Lambda Advanced Settings
      properties:
        _gate_lambda_advanced:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: lambda_advanced
        lambda_timeout:
          title: Timeout (seconds)
          type: number
          description: Lambda Function timeout in seconds
          default: 3
        lambda_description:
          title: Description
          type: string
          description: Description of the Lambda Function
        lambda_vpc_subnet_ids:
          title: VPC Subnet IDs
          type: string
          description: Comma-separated list of subnet IDs for VPC-attached Lambda
        lambda_vpc_security_group_ids:
          title: VPC Security Group IDs
          type: string
          description: Comma-separated list of security group IDs for VPC-attached Lambda

    # Page 4: SQS Advanced (optional)
    - title: SQS Advanced Settings
      properties:
        _gate_sqs_advanced:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: sqs_advanced
        fifo_queue:
          title: FIFO Queue?
          type: boolean
          description: Enable FIFO queue (note - FIFO queue names must end in .fifo)
          default: true
        content_based_deduplication:
          title: Content Based Deduplication?
          type: boolean
          description: Enable content-based deduplication for FIFO queues
          default: false
        visibility_timeout_seconds:
          title: Visibility Timeout (seconds)
          type: number
          description: Visibility timeout for the queue (0 to 43200)
          default: 30
        message_retention_seconds:
          title: Message Retention (seconds)
          type: number
          description: Number of seconds SQS retains a message (60 to 1209600)
          default: 345600
        delay_seconds:
          title: Delay Seconds
          type: number
          description: Delivery delay for all messages in the queue (0 to 900)
          default: 0

    # Page 5: API Gateway Advanced (optional)
    - title: API Gateway Advanced Settings
      properties:
        _gate_apigateway_advanced:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: apigateway_advanced
        api_description:
          title: API Description
          type: string
          description: Description of the API Gateway
          default: "Serverless Stack API Gateway"
        http_method:
          title: HTTP Method
          type: string
          description: HTTP method for the API Gateway method
          default: "GET"
          enum:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - ANY
        authorization:
          title: Authorization
          type: string
          description: Authorization type for the API Gateway method
          default: "NONE"
        resource_path:
          title: Resource Path
          type: string
          description: Path for the API resource
          default: "resource"

    # Page 6: DynamoDB Advanced (optional)
    - title: DynamoDB Advanced Settings
      properties:
        _gate_dynamodb_advanced:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: dynamodb_advanced
        enable_streams:
          title: Enable Streams
          type: boolean
          description: Enable DynamoDB streams
          default: false
        enable_encryption:
          title: Enable Encryption
          type: boolean
          description: Enable DynamoDB server-side encryption
          default: true
        enable_point_in_time_recovery:
          title: Enable Point in Time Recovery
          type: boolean
          description: Enable DynamoDB point-in-time recovery
          default: true
        hash_key_type:
          title: Hash Key Type
          type: string
          description: Hash Key type - S (String), N (Number), or B (Binary)
          default: "S"
          enum:
            - S
            - N
            - B
      if:
        properties:
          billing_mode:
            const: PROVISIONED
      then:
        properties:
          autoscale_min_read_capacity:
            title: Autoscale Min Read Capacity
            type: number
            description: Minimum read capacity units (PROVISIONED billing only)
            default: 5
          autoscale_min_write_capacity:
            title: Autoscale Min Write Capacity
            type: number
            description: Minimum write capacity units (PROVISIONED billing only)
            default: 5

    # Page 7: IAM Role Advanced (optional)
    - title: IAM Role Advanced Settings
      properties:
        _gate_iam_advanced:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: iam_advanced
        create_iam_role:
          title: Create New IAM Role
          type: boolean
          description: >-
            Create a new IAM execution role for this Lambda function.
            Disable this to attach an existing role — if disabled, you must provide
            the full ARN of an existing role below.
          default: true
      if:
        properties:
          create_iam_role:
            const: true
      then:
        properties:
          iam_role_name:
            title: IAM Role Name
            type: string
            description: Name for the new IAM execution role to create.
            ui:field: DerivedField
            ui:options:
              sourceField: stack_name
              suffix: "-lambda-role"
              editable: true
      else:
        required:
          - existing_iam_role_arn
        properties:
          existing_iam_role_arn:
            title: Existing IAM Role ARN
            type: string
            description: >-
              Required. Enter the full ARN of the existing IAM role to attach to
              the Lambda function (e.g. arn:aws:iam::123456789012:role/my-existing-role).

    # Page 8: Resource Connections (optional)
    - title: Resource Connections
      description: Choose which resources to wire together. All enabled by default.
      properties:
        _gate_connections:
          title: Section Gate
          type: string
          ui:field: SectionGateField
          ui:options:
            sectionKey: connections
        connect_apigw_lambda:
          title: Connect API Gateway → Lambda
          type: boolean
          description: >-
            Configure API Gateway to invoke Lambda via AWS_PROXY integration
            and grant the necessary invocation permission.
          default: true
        connect_lambda_env_vars:
          title: Set Lambda env vars for SQS & DynamoDB
          type: boolean
          description: >-
            Inject SQS_QUEUE_URL and DYNAMODB_TABLE as Lambda environment
            variables so the function can reach the queue and table.
          default: true
        connect_iam_policies:
          title: Add IAM inline policies for SQS & DynamoDB
          type: boolean
          description: >-
            Attach inline IAM policies to the Lambda execution role granting
            send/receive/delete on SQS and CRUD on DynamoDB.
          default: true
        connect_iam_lambda:
          title: Attach IAM Role → Lambda
          type: boolean
          description: >-
            Automatically derive and attach the IAM role ARN to the Lambda function.
            If using an existing role, disable "Create New IAM Role" and provide the ARN on the IAM page.
          default: true

  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_platform'
        headers:
          content-type: 'application/json'
        body:
          workflow_name: ${{ "NewServerlessStack" }}
          workflow_id: ${{ "NewServerlessStack-" + parameters.github_org + "-" + parameters.stack_name + "-" + parameters.deployment_env }}
          task_queue: ${{ platform.taskQueue }}
          workflow_args:
            stack_name: ${{ parameters.stack_name }}
            environment: ${{ parameters.deployment_env }}
            repo_owner: ${{ parameters.github_org }}
            repo_name: ${{ parameters.github_repo }}
            branch_name: ${{ parameters.github_org + "/" + parameters.deployment_env + "/serverless-stack/" + parameters.stack_name }}
            pr_title: '${{ "Add Serverless Stack: " + parameters.stack_name + " (" + parameters.github_org + "/" + parameters.deployment_env + ")" }}'
            pr_body: '${{ "Provisions a serverless stack named " + parameters.stack_name + " in the " + parameters.deployment_env + " environment for " + parameters.github_org + "." }}'
            stack_version: ${{ parameters.stack_version }}
            # Module versions resolved from stack_version v1.0.0
            lambda_module_version: ${{ parameters.stack_version == "v1.0.0" and "LAMBDA-v1.0.7" or "LAMBDA-v1.0.7" }}
            sqs_module_version: ${{ parameters.stack_version == "v1.0.0" and "SQS-v1.0.1" or "SQS-v1.0.1" }}
            apigateway_module_version: ${{ parameters.stack_version == "v1.0.0" and "APIGATEWAY-v1.0.4" or "APIGATEWAY-v1.0.4" }}
            dynamodb_module_version: ${{ parameters.stack_version == "v1.0.0" and "DYNAMODB-v1.0.6" or "DYNAMODB-v1.0.6" }}
            iam_roles_module_version: ${{ parameters.stack_version == "v1.0.0" and "IAM_ROLES-v1.0.0" or "IAM_ROLES-v1.0.0" }}
            # Lambda config
            function_name: ${{ parameters.function_name }}
            iam_role_name: ${{ parameters.iam_role_name }}
            package_type: ${{ parameters.package_type }}
            image_uri: ${{ parameters.image_uri }}
            handler: ${{ parameters.handler }}
            runtime: ${{ parameters.runtime }}
            lambda_timeout: ${{ parameters.lambda_timeout }}
            lambda_description: ${{ parameters.lambda_description }}
            lambda_vpc_subnet_ids: ${{ parameters.lambda_vpc_subnet_ids }}
            lambda_vpc_security_group_ids: ${{ parameters.lambda_vpc_security_group_ids }}
            # SQS config
            queue_name: ${{ parameters.queue_name }}
            fifo_queue: ${{ parameters.fifo_queue }}
            content_based_deduplication: ${{ parameters.content_based_deduplication }}
            visibility_timeout_seconds: ${{ parameters.visibility_timeout_seconds }}
            message_retention_seconds: ${{ parameters.message_retention_seconds }}
            delay_seconds: ${{ parameters.delay_seconds }}
            # API Gateway config
            api_name: ${{ parameters.api_name }}
            api_description: ${{ parameters.api_description }}
            http_method: ${{ parameters.http_method }}
            authorization: ${{ parameters.authorization }}
            resource_path: ${{ parameters.resource_path }}
            # DynamoDB config
            table_name: ${{ parameters.table_name }}
            hash_key: ${{ parameters.hash_key }}
            hash_key_type: ${{ parameters.hash_key_type }}
            billing_mode: ${{ parameters.billing_mode }}
            autoscale_min_read_capacity: ${{ parameters.autoscale_min_read_capacity }}
            autoscale_min_write_capacity: ${{ parameters.autoscale_min_write_capacity }}
            enable_streams: ${{ parameters.enable_streams }}
            enable_encryption: ${{ parameters.enable_encryption }}
            enable_point_in_time_recovery: ${{ parameters.enable_point_in_time_recovery }}
            # Connections
            connect_apigw_lambda: ${{ parameters.connect_apigw_lambda }}
            connect_lambda_env_vars: ${{ parameters.connect_lambda_env_vars }}
            connect_iam_policies: ${{ parameters.connect_iam_policies }}
            connect_iam_lambda: ${{ parameters.connect_iam_lambda }}
            # IAM role config
            create_iam_role: ${{ parameters.create_iam_role }}
            existing_iam_role_arn: ${{ parameters.existing_iam_role_arn }}

  output:
    links:
      - title: 'Go to pull request'
        url: '${{"https://github.example.com/"+parameters.github_org+"/"+parameters.github_repo+"/pulls"}}'
        icon: github
