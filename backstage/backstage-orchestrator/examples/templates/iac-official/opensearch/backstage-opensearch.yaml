apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: backstage-opensearch-template
  title: Create OpenSearch Domain
  description: Provision and configure a new AWS OpenSearch (managed) domain.
  tags:
    - 'single-resource'
    - 'product-containers'
    - 'product-serverless'
    - 'tier-techlead'
spec:
  owner: fdp/fcs-next
  type: AWS Service
  parameters:
    - title: Resource Info
      required:
        - domain_name
        - deployment_env
        - github_org
        - github_repo
      properties:
        domain_name:
          title: Domain Name
          type: string
          description: "Name for the OpenSearch domain. Use lowercase letters, numbers, and hyphens only. Must start with a letter. Max 28 characters."
          pattern: '^[a-z][a-z0-9-]{2,27}$'
          ui:help: "Example: my-search-domain. No spaces or underscores."
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to iac)
          default: "iac"
    - title: OpenSearch Configuration
      required:
        - opensearch_version
        - cluster_config_instance_type
        - ebs_options_volume_size
      properties:
        opensearch_version:
          title: OpenSearch Version
          type: string
          description: The version of OpenSearch to deploy
          default: "OpenSearch_2.11"
          enum:
            - 'OpenSearch_2.17'
            - 'OpenSearch_2.15'
            - 'OpenSearch_2.13'
            - 'OpenSearch_2.11'
            - 'OpenSearch_2.9'
            - 'OpenSearch_2.7'
            - 'OpenSearch_2.5'
            - 'OpenSearch_1.3'
          enumNames:
            - 'OpenSearch 2.17'
            - 'OpenSearch 2.15'
            - 'OpenSearch 2.13'
            - 'OpenSearch 2.11'
            - 'OpenSearch 2.9'
            - 'OpenSearch 2.7'
            - 'OpenSearch 2.5'
            - 'OpenSearch 1.3 (legacy)'
        cluster_config_instance_type:
          title: Instance Type
          type: string
          description: Instance type for data nodes in the cluster
          default: "r5.large.search"
          enum:
            - 't3.small.search'
            - 't3.medium.search'
            - 'm5.large.search'
            - 'm5.xlarge.search'
            - 'm5.2xlarge.search'
            - 'r5.large.search'
            - 'r5.xlarge.search'
            - 'r5.2xlarge.search'
            - 'r5.4xlarge.search'
          enumNames:
            - 't3.small (2 vCPU, 2 GB RAM) - dev/test'
            - 't3.medium (2 vCPU, 4 GB RAM) - dev/test'
            - 'm5.large (2 vCPU, 8 GB RAM)'
            - 'm5.xlarge (4 vCPU, 16 GB RAM)'
            - 'm5.2xlarge (8 vCPU, 32 GB RAM)'
            - 'r5.large (2 vCPU, 16 GB RAM) - recommended'
            - 'r5.xlarge (4 vCPU, 32 GB RAM)'
            - 'r5.2xlarge (8 vCPU, 64 GB RAM)'
            - 'r5.4xlarge (16 vCPU, 128 GB RAM)'
        cluster_config_instance_count:
          title: Instance Count
          type: number
          description: Number of data nodes in the cluster
          default: 3
          minimum: 1
          maximum: 80
        ebs_options_volume_size:
          title: EBS Volume Size (GB)
          type: number
          description: Size of EBS volumes attached to data nodes in GB
          default: 100
          minimum: 10
          maximum: 16384
        ebs_options_volume_type:
          title: EBS Volume Type
          type: string
          description: Type of EBS volumes attached to data nodes
          default: "gp3"
          enum:
            - 'gp3'
            - 'gp2'
            - 'io1'
          enumNames:
            - 'gp3 (General Purpose SSD - recommended)'
            - 'gp2 (General Purpose SSD)'
            - 'io1 (Provisioned IOPS SSD)'
    - title: Network Configuration
      properties:
        vpc_options_subnet_ids:
          title: Subnet IDs
          type: array
          items:
            type: string
          ui:field: DelimitedTextArray
          ui:options:
            name: Subnet IDs
            description: Optional - leave empty to auto-resolve from environment data sources
        vpc_options_security_group_ids:
          title: VPC Security Group IDs
          type: array
          items:
            type: string
          ui:field: DelimitedTextArray
          ui:options:
            name: VPC Security Group ID(s)
            description: Optional - leave empty to auto-resolve from environment data sources
    - title: Security & Encryption
      properties:
        domain_endpoint_options_enforce_https:
          title: Enforce HTTPS
          type: boolean
          description: Require HTTPS for all traffic to the domain endpoint
          default: true
        encrypt_at_rest_enabled:
          title: Encryption at Rest
          type: boolean
          description: Enable encryption at rest using KMS
          default: true
        node_to_node_encryption_enabled:
          title: Node-to-Node Encryption
          type: boolean
          description: Enable TLS encryption between cluster nodes
          default: true
        advanced_security_options_enabled:
          title: Fine-Grained Access Control
          type: boolean
          description: Enable fine-grained access control (advanced security options)
          default: false
    - title: Cluster High Availability
      properties:
        cluster_config_dedicated_master_enabled:
          title: Dedicated Master Nodes
          type: boolean
          description: Enable dedicated master nodes for cluster stability
          default: true
        cluster_config_dedicated_master_type:
          title: Dedicated Master Instance Type
          type: string
          description: Instance type for dedicated master nodes
          default: "r5.large.search"
          enum:
            - 't3.small.search'
            - 't3.medium.search'
            - 'm5.large.search'
            - 'r5.large.search'
            - 'r5.xlarge.search'
          enumNames:
            - 't3.small (dev/test only)'
            - 't3.medium (dev/test only)'
            - 'm5.large'
            - 'r5.large (recommended)'
            - 'r5.xlarge'
        cluster_config_dedicated_master_count:
          title: Dedicated Master Count
          type: number
          description: Number of dedicated master nodes (recommended 3)
          default: 3
          enum:
            - 3
            - 5
          enumNames:
            - '3 (recommended)'
            - '5 (large clusters)'
        cluster_config_zone_awareness_enabled:
          title: Multi-AZ (Zone Awareness)
          type: boolean
          description: Distribute nodes across multiple Availability Zones for high availability
          default: true
        cluster_config_availability_zone_count:
          title: Availability Zone Count
          type: number
          description: Number of Availability Zones (requires zone awareness enabled)
          default: 3
          enum:
            - 2
            - 3
          enumNames:
            - '2 AZs'
            - '3 AZs (recommended)'
    - title: Module Version
      description: |
        Override module versioning. Defaults are suitable for most deployments.
      properties:
        module_version:
          title: Module Version
          type: string
          description: Tag version of the OpenSearch module in FCS-IaC-Modules (e.g. v2.1.0)
          default: "v2.1.0"
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_fcsnext'
        headers:
          content-type: 'application/json'
        body:
            workflow_name: ${{ "NewIAC" }}
            workflow_id: ${{ "NewIAC-opensearch-" + parameters.github_org + "-" + parameters.domain_name + "-" + parameters.deployment_env }}
            task_queue: ${{ fcs.taskQueue }}
            workflow_args:
              branch_name: ${{ parameters.github_org + "/" + parameters.deployment_env + "/opensearch/" + parameters.domain_name }}
              repo_owner: ${{ parameters.github_org }}
              repo_name: ${{ parameters.github_repo }}
              pr_title: '${{ "Add OpenSearch Domain: " + parameters.domain_name + " (" + parameters.github_org + "/" + parameters.deployment_env + ")" }}'
              pr_body: '${{ "Provisions an OpenSearch domain named " + parameters.domain_name + " in the " + parameters.deployment_env + " environment for " + parameters.github_org + "." }}'
              module_source_base: ${{ "git@github.helix.gsa.gov:fdp/FCS-IaC-Modules.git/" }}
              module_version: ${{ parameters.module_version }}
              env_config_path: ${{ "env/{environment}/env.hcl" }}
              resource_type: ${{ "opensearch" }}
              resource_config:
                name: ${{ parameters.domain_name }}
                environments: ${{ parameters.deployment_env }}
                config:
                  domain_name: ${{ parameters.domain_name }}
                  opensearch_version: ${{ parameters.opensearch_version }}
                  # Cluster config
                  cluster_config_instance_type: ${{ parameters.cluster_config_instance_type }}
                  cluster_config_instance_count: ${{ parameters.cluster_config_instance_count }}
                  cluster_config_dedicated_master_enabled: ${{ parameters.cluster_config_dedicated_master_enabled }}
                  cluster_config_dedicated_master_type: ${{ parameters.cluster_config_dedicated_master_type }}
                  cluster_config_dedicated_master_count: ${{ parameters.cluster_config_dedicated_master_count }}
                  cluster_config_zone_awareness_enabled: ${{ parameters.cluster_config_zone_awareness_enabled }}
                  cluster_config_availability_zone_count: ${{ parameters.cluster_config_availability_zone_count }}
                  # EBS
                  ebs_options_volume_size: ${{ parameters.ebs_options_volume_size }}
                  ebs_options_volume_type: ${{ parameters.ebs_options_volume_type }}
                  # Network
                  vpc_options_subnet_ids: ${{ parameters.vpc_options_subnet_ids }}
                  vpc_options_security_group_ids: ${{ parameters.vpc_options_security_group_ids }}
                  # Security
                  domain_endpoint_options_enforce_https: ${{ parameters.domain_endpoint_options_enforce_https }}
                  encrypt_at_rest_enabled: ${{ parameters.encrypt_at_rest_enabled }}
                  node_to_node_encryption_enabled: ${{ parameters.node_to_node_encryption_enabled }}
                  advanced_security_options_enabled: ${{ parameters.advanced_security_options_enabled }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.helix.gsa.gov/"+parameters.github_org+"/"+parameters.github_repo+"/pulls"}}
        icon: github
