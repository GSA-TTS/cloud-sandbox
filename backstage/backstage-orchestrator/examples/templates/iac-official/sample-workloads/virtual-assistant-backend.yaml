apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: virtual-assistant-backend
  title: Example Virtual Assistant BE
  description: This template deploys Example's Virtual Assistant Backend.
  tags:
    - 'blueprint'
    - 'product-containers'
    - 'tier-developer'
spec:
  owner: example-org/iac-deployment
  type: Blueprint
  parameters:
    - title: Example Virtual Assistant Backend
      required:
        - deployment_env
        - github_org
        - github_repo
      properties:
        deployment_env:
          title: Environment
          type: string
          description: The environment the service will be deployed in
          default: dev
          enum:
            - dev
            - test
            - staging
            - prod
          enumNames:
            - 'dev'
            - 'test'
            - 'staging'
            - 'prod'
        github_org:
          title: GitHub Organization
          type: string
          description: The organization in GitHub that should own the deployment
          ui:field: GitOrgPicker
        github_repo:
          title: GitHub Repository Name
          type: string
          description: Enter the name of the organization's GitHub repository used for IaC configuration (defaulted to iac)
          default: "iac"
    - title: Example Virtual Assistant Backend Parameters
      required:
        - vpc_id
        - private_subnets
        - default_sg
        - stack_prefix
        - backend_ecr_url
        - backend_image_tag
        - aws_region
        - shared_data_bucket
        - database_name
      properties:
        vpc_id:
          title: VPC ID
          type: string
          description: The ID of the VPC to use
          default: ""
        private_subnets:
          title: Private Subnets
          type: array
          items:
            type: string
          ui:field: DelimitedTextArray
          ui:options:
            name: Private Subnets
            description: A comma-delimited list of subnets
        default_sg:
          title: Default SG
          type: string
          description: The default security group to use
          default: ""
        stack_prefix:
          title: Stack Prefix
          type: string
          description: The prefix to apply to the stack
          default: ""
        backend_ecr_url:
          title: Backend ECR URL
          type: string
          description: The url for the backend ECR
          default: ""
        backend_image_tag:
          title: Backend Image Tag
          type: string
          description: The tag for the backend image
          default: ""
        aws_region:
          title: AWS Region
          type: string
          description: The AWS region to deploy into
          default: "us-east-1"
        shared_data_bucket:
          title: Shared Data Bucket
          type: string
          description: The name of the shared data bucket
          default: ""
        database_name:
          title: Database Name
          type: string
          description: The database name
          default: "sample_virtual_assistant"
  steps:
    - id: backstage_request_with_input
      name: backstage request with inputs
      action: http:backstage:request
      input:
        method: 'POST'
        path: 'proxy/awsExecuteEndpoint/execute_platform'
        headers:
          content-type: 'application/json'
        body:
            workflow_name: ${{ "NewIAC" }}
            workflow_id: ${{ "NewIAC-virt-asst-be-" + parameters.github_org + "-" + parameters.stack_prefix + "-" + parameters.deployment_env }}
            task_queue: ${{ platform.taskQueue }}
            workflow_args:
              branch_name: ${{ parameters.github_org + "/" + parameters.deployment_env + "/virt-asst-be/" + parameters.stack_prefix }}
              repo_owner: ${{ parameters.github_org }}
              repo_name: ${{ parameters.github_repo }}
              pr_title: '${{ "Add Virtual Assistant BE: " + parameters.stack_prefix + " (" + parameters.github_org + "/" + parameters.deployment_env + ")" }}'
              pr_body: '${{ "Provisions a Virtual Assistant Backend named " + parameters.stack_prefix + " in the " + parameters.deployment_env + " environment for " + parameters.github_org + "." }}'
              module_source_base: ${{ "git@github.example.com:example-org/iac.git/" }}
              env_config_path: ${{ "env/{environment}/env.hcl" }}
              resource_type: ${{ "virt-asst-be" }}
              tenant: ${{ "Example" }}
              resource_config:
                environments: ${{ parameters.deployment_env }}
                config:
                  name: ${{ "example-virt-asst-be" }}
                  vpc_id: ${{ parameters.vpc_id }}
                  private_subnets: ${{ parameters.private_subnets }}
                  default_sg: ${{ parameters.default_sg }}
                  stack_prefix: ${{ parameters.stack_prefix }}
                  backend_ecr_url: ${{ parameters.backend_ecr_url }}
                  backend_image_tag: ${{ parameters.backend_image_tag }}
                  aws_region: ${{ parameters.aws_region }}
                  shared_data_bucket: ${{ parameters.shared_data_bucket }}
                  database_name: ${{ parameters.database_name }}
  output:
    links:
      - title: 'Go to pull request'
        url: ${{"https://github.example.com/"+parameters.github_org+"/"+parameters.github_repo+"/pulls"}}
        icon: github
