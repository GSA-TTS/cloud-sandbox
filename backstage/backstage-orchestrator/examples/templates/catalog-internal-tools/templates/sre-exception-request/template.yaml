        url: ${{ steps['create-exception-issue'].output.issueUrl }}
        icon: github
    text:
      - title: What Happens Next
        content: |
          Your SRE Exception Request has been submitted. Here is what to expect:

          1. **Acknowledgement (2 business days)** — The SRE team will acknowledge receipt and assign a reviewer.
          2. **SRE review (Week 1–2)** — The assigned reviewer evaluates the legitimacy of the constraint, the adequacy of the mitigation, and the credibility of the remediation plan. They may request a 30-minute clarification call.
          3. **Portfolio Lead endorsement (Week 3)** — ${{ parameters.portfolioLeadName }} will be contacted directly by the SRE team to endorse the request before it proceeds.
          4. **Director of SRE decision (Week 3–4)** — Final approval or denial issued. If approved, the exception is logged with an expiration date 90 days from the decision.
          5. **Quarterly tracking** — Active exceptions are reviewed each quarter. You will receive a 30-day advance notice before expiration.

          ⚠️ If your submission targets a **Category 4 (Security & Compliance)** criterion, the SRE team will redirect your request to the remediation-support track. A Category 4 exception cannot unblock the intake process — the security gaps must be fixed and re-assessed.

          **Questions?** Reach the SRE team at sre-team@example.gov or in the **#sre-team** Google Chat space.
          **Office Hours:** Tuesdays 2–3 PM EST
