---
# Cloud Foundry Manifest for Backstage Orchestrator
# Deploying a production-grade Backstage instance to cloud.gov (FedRAMP Moderate)
# Official documentation: https://backstage.io/docs/deployment/

applications:
  - name: backstage-fcs-sso-portal
    path: deploy-workspace
    memory: 2048M # Max limit on sandbox orgs
    disk_quota: 4096M # Increased to 4GB to provide plenty of compression buffer space on cloud.gov
    instances: 1 # Scale to 2+ in non-sandbox organization for High Availability (HA)
    buildpacks:
      - nodejs_buildpack

    # We use a custom start command that runs the credentials extractor first,
    # then starts the production Backstage backend.
    command: node -r ./vcap-env.js packages/backend --config app-config.yaml --config app-config.production.yaml

    env:
      NODE_ENV: production
      YARN_PRODUCTION: 'true'
      NODE_OPTIONS: --max-old-space-size=1536 # Constrain heap so CF staging doesn't OOM kill container
      NODE_MODULES_CACHE: 'false' # Disable npm cache to prevent output-cache disk exhaustion
      TMPDIR: '/tmp' # CF lifecycle expects a pre-existing TMPDIR during droplet generation
      YARN_CACHE_FOLDER: '/home/vcap/app/.yarn-cache' # Put yarn cache inside the app to prevent /tmp out of space
      NPM_CONFIG_CACHE: '/home/vcap/app/.npm-cache' # Redirect npm cache to writable disk
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true' # Force legacy peer dep resolution for npm
      NPM_CONFIG_PRODUCTION: 'true' # Only install runtime dependencies (pre-compiled assets already exist)
      NPM_CONFIG_TMP: '/home/vcap/app/.npm-tmp' # Redirect npm temp folder to writable disk

      # Set Backstage's public URLs. Note: update with your cloud.gov app route
      APP_CONFIG_app_baseUrl: https://backstage-fcs-sso-portal.app.cloud.gov
      APP_CONFIG_backend_baseUrl: https://backstage-fcs-sso-portal.app.cloud.gov

      # Optional: Ingestion rate limiting tuning for large catalogs
      BACKSTAGE_CATALOG_SCAN_INTERVAL: '30m'

    services:
      # Bind to your AWS RDS PostgreSQL service broker on cloud.gov
      # Run first: cf create-service aws-rds micro-psql backstage-db
      - backstage-db
      # Bind to cloud.gov identity provider
      - backstage-sso
